                  def temperature = (jsonBody =~
                  /"temperature":\s*([\d.]+)/)[0][1]

                  def respiratoryRate = (jsonBody =~
                  /"respiratoryRate":\s*(\d+)/)[0][1]


                  // Create family notification message

                  def notificationId = "NOTIFY-" + System.currentTimeMillis()

                  def notificationTimestamp =
                  LocalDateTime.now().format(DateTimeFormatter.ISO_LOCAL_DATE_TIME)

                  def message = "Critical vital signs detected for patient
                  ${patientId}. Medical team has been alerted."


                  // Build JSON string manually and convert to String

                  def result = """{
                    "notificationId": "${notificationId}",
                    "patientId": "${patientId}",
                    "ward": "${ward}",
                    "alertLevel": "CRITICAL",
                    "timestamp": "${notificationTimestamp}",
                    "message": "${message}",
                    "vitalSigns": {
                      "heartRate": ${heartRate},
                      "bloodPressure": {
                        "systolic": ${systolic},
                        "diastolic": ${diastolic}
                      },
                      "oxygenSaturation": ${oxygenSat},
                      "temperature": ${temperature},
                      "respiratoryRate": ${respiratoryRate}
                    },
                    "contactMethod": "SMS_AND_EMAIL",
                    "urgency": "HIGH",
                    "familyContacts": [
                      {
                        "name": "Emergency Contact",
                        "phone": "+1-555-0101",
                        "email": "emergency@family.com"
                      },
                      {
                        "name": "Primary Contact",
                        "phone": "+1-555-0102",
                        "email": "primary@family.com"
                      }
                    ]
                  }"""

                  return result.toString()
        - setHeader:
            id: extract-family-patient-id
            expression:
              jsonpath:
                expression: $.patientId
            name: patientId
        - log:
            id: log-family-processing
            message: "Wire Tap 4 - Family: Critical alert notification sent for patient
              ${header.patientId}"
        - to:
            id: family-notification-output
