
- route:
    id: patient-vital-signs-processor
    from:
      id: vital-signs-timer
      uri: timer
      parameters:
        delay: "10000"
        repeatCount: 10
        timerName: vitalSignsGenerator
      steps:
        - setBody:
            id: generate-vital-signs
            expression:
              groovy: >
                import java.util.Random

                import java.time.LocalDateTime

                import java.time.format.DateTimeFormatter


                def random = new Random()

                def patientIds = ["P001", "P002", "P003", "P004", "P005"]

                def wards = ["ICU", "CCU", "Emergency", "Surgery", "General"]

                def deviceTypes = ["Philips_Monitor", "GE_Vital_Signs",
                "Mindray_Patient_Monitor"]


                def patientId = patientIds[random.nextInt(patientIds.size())]

                def heartRate = 60 + random.nextInt(40) // 60-100 normal range

                def systolic = 90 + random.nextInt(50)  // 90-140 range

                def diastolic = 60 + random.nextInt(30) // 60-90 range

                def oxygenSat = 95 + random.nextInt(6)  // 95-100 normal

                def temperature = 36.0 + (random.nextDouble() * 2.5) //
                36.0-38.5°C

                def respiratoryRate = 12 + random.nextInt(8) // 12-20 normal

                def ward = wards[random.nextInt(wards.size())]

                def deviceType = deviceTypes[random.nextInt(deviceTypes.size())]

                def deviceId = "DEV-" + (1000 + random.nextInt(9000))

                def timestamp =
                LocalDateTime.now().format(DateTimeFormatter.ISO_LOCAL_DATE_TIME)


                // Simulate some critical conditions occasionally

                def isCritical = random.nextInt(10) == 0 // 10% chance

                if (isCritical) {
                  heartRate = random.nextBoolean() ? 45 + random.nextInt(10) : 120 + random.nextInt(40)
                  oxygenSat = 85 + random.nextInt(10)
                  temperature = 38.5 + (random.nextDouble() * 2.0)
                }


                def alertLevel = isCritical ? "CRITICAL" : (heartRate > 100 ||
                oxygenSat < 95) ? "WARNING" : "NORMAL"


                // Build JSON string manually

                return """{
                  "patientId": "${patientId}",
                  "timestamp": "${timestamp}",
                  "ward": "${ward}",
                  "deviceType": "${deviceType}",
                  "deviceId": "${deviceId}",
                  "vitalSigns": {
                    "heartRate": ${heartRate},
                    "bloodPressure": {
                      "systolic": ${systolic},
                      "diastolic": ${diastolic}
                    },
                    "oxygenSaturation": ${oxygenSat},
                    "temperature": ${temperature},
                    "respiratoryRate": ${respiratoryRate}
                  },
                  "alertLevel": "${alertLevel}",
                  "isCritical": ${isCritical}
                }"""
        - log:
            id: log-incoming-vitals
            message: "Processing vital signs: ${body}"
        - to:
            id: main-processing-flow
            uri: direct:processVitalSigns
- route:
    id: main-vital-signs-processing
    from:
      id: process-vital-signs-entry
      uri: direct:processVitalSigns
      steps:
        - wireTap:
            id: research-data-wire-tap
            uri: direct:researchDataCollection
            copy: true
        - choice:
            id: compliance-wire-tap-choice
            when:
              - steps:
                  - wireTap:
                      id: compliance-wire-tap
                      uri: direct:complianceAudit
                      copy: true
                groovy: >
                  def jsonBody = body.toString()

                  def alertLevel = (jsonBody =~
                  /"alertLevel":\s*"([^"]+)"/)[0][1]

                  return alertLevel == "CRITICAL"
        - wireTap:
            id: analytics-wire-tap
            uri: direct:predictiveAnalytics
            copy: true
        - choice:
            id: family-notification-choice
            when:
              - steps:
                  - wireTap:
                      id: family-notification-wire-tap
                      uri: direct:familyNotification
                      copy: true
                groovy: >
                  def jsonBody = body.toString()

                  def isCritical = (jsonBody =~
                  /"isCritical":\s*(true|false)/)[0][1]

                  return isCritical == "true"
        - setHeader:
            id: set-dashboard-header
            constant: RealTimeMonitoring
            name: ProcessingStep
        - setHeader:
            id: extract-patient-id-header
            expression:
              groovy: |
                def jsonBody = body.toString()
                def patientIdMatcher = (jsonBody =~ /"patientId":\s*"([^"]+)"/)
                if (patientIdMatcher.find()) {
                  return patientIdMatcher[0][1]
                }
                return null
            name: patientId
        - log:
            id: log-main-processing
            message: Main Flow - Updating real-time dashboard for patient
              ${header.patientId}
        - to:
            id: dashboard-update
            uri: direct:updateDashboard
- route:
    id: research-data-collection-route
    from:
      id: research-data-entry
      uri: direct:researchDataCollection
      steps:
        - setHeader:
            id: set-research-header
            constant: ResearchData
            name: WireTapType
        - setBody:
            id: anonymize-research-data
            expression:
              groovy:
                expression: >
                  // Extract values using regex patterns from JSON string

                  def jsonBody = body.toString()


                  def patientId = (jsonBody =~ /"patientId":\s*"([^"]+)"/)[0][1]

                  def timestamp = (jsonBody =~ /"timestamp":\s*"([^"]+)"/)[0][1]

                  def ward = (jsonBody =~ /"ward":\s*"([^"]+)"/)[0][1]

                  def deviceType = (jsonBody =~
                  /"deviceType":\s*"([^"]+)"/)[0][1]

                  def deviceId = (jsonBody =~ /"deviceId":\s*"([^"]+)"/)[0][1]

                  def heartRate = (jsonBody =~ /"heartRate":\s*(\d+)/)[0][1]

                  def systolic = (jsonBody =~ /"systolic":\s*(\d+)/)[0][1]

                  def diastolic = (jsonBody =~ /"diastolic":\s*(\d+)/)[0][1]

                  def oxygenSat = (jsonBody =~
                  /"oxygenSaturation":\s*(\d+)/)[0][1]

                  def temperature = (jsonBody =~
                  /"temperature":\s*([\d.]+)/)[0][1]

                  def respiratoryRate = (jsonBody =~
                  /"respiratoryRate":\s*(\d+)/)[0][1]

                  def alertLevel = (jsonBody =~
                  /"alertLevel":\s*"([^"]+)"/)[0][1]

                  def isCritical = (jsonBody =~
                  /"isCritical":\s*(true|false)/)[0][1]


                  // Anonymize patient data for research

                  def anonPatientId = "ANON-" + patientId.substring(1)

                  def researchId = "R-" + System.currentTimeMillis()


                  // Build JSON string manually and convert to String

                  def result = """{
                    "patientId": "${anonPatientId}",
                    "timestamp": "${timestamp}",
                    "ward": "${ward}",
                    "deviceType": "${deviceType}",
                    "deviceId": "${deviceId}",
                    "vitalSigns": {
                      "heartRate": ${heartRate},
                      "bloodPressure": {
                        "systolic": ${systolic},
                        "diastolic": ${diastolic}
                      },
                      "oxygenSaturation": ${oxygenSat},
                      "temperature": ${temperature},
                      "respiratoryRate": ${respiratoryRate}
                    },
                    "alertLevel": "${alertLevel}",
                    "isCritical": ${isCritical},
                    "researchId": "${researchId}",
                    "dataUsage": "MEDICAL_RESEARCH",
                    "anonymized": true
                  }"""

                  return result.toString()
        - log:
            id: log-research-processing
            message: "Wire Tap 1 - Research: Anonymized data stored for patient research:
              ${body}"
        - to:
            id: research-file-output
            uri: file:research-data/collected
            parameters:
              fileName: research-${date:now:yyyyMMdd-HHmmss-SSS}.json
