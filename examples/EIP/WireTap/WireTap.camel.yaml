        - setBody:
            id: prepare-family-notification
            expression:
              groovy:
                expression: >
                  import java.time.LocalDateTime

                  import java.time.format.DateTimeFormatter


                  // Extract values using regex patterns from JSON string

                  def jsonBody = body.toString()


                  def patientId = (jsonBody =~ /"patientId":\s*"([^"]+)"/)[0][1]

                  def ward = (jsonBody =~ /"ward":\s*"([^"]+)"/)[0][1]

