              fileName: audit-${date:now:yyyyMMdd-HHmmss-SSS}.json
- route:
    id: predictive-analytics-route
    from:
      id: analytics-entry
      uri: direct:predictiveAnalytics
      steps:
        - setHeader:
            id: set-analytics-header
            constant: PredictiveAnalytics
            name: WireTapType
        - setBody:
            id: prepare-analytics-data
            expression:
              groovy:
                expression: >
                  // Extract values using regex patterns from JSON string

                  def jsonBody = body.toString()


                  def patientId = (jsonBody =~ /"patientId":\s*"([^"]+)"/)[0][1]

                  def timestamp = (jsonBody =~ /"timestamp":\s*"([^"]+)"/)[0][1]

                  def ward = (jsonBody =~ /"ward":\s*"([^"]+)"/)[0][1]

                  def deviceType = (jsonBody =~
                  /"deviceType":\s*"([^"]+)"/)[0][1]

                  def deviceId = (jsonBody =~ /"deviceId":\s*"([^"]+)"/)[0][1]

                  def heartRate = Integer.parseInt((jsonBody =~
                  /"heartRate":\s*(\d+)/)[0][1])

                  def systolic = Integer.parseInt((jsonBody =~
                  /"systolic":\s*(\d+)/)[0][1])

                  def diastolic = Integer.parseInt((jsonBody =~
                  /"diastolic":\s*(\d+)/)[0][1])

                  def oxygenSat = Integer.parseInt((jsonBody =~
                  /"oxygenSaturation":\s*(\d+)/)[0][1])

                  def temperature = Double.parseDouble((jsonBody =~
                  /"temperature":\s*([\d.]+)/)[0][1])

                  def respiratoryRate = Integer.parseInt((jsonBody =~
                  /"respiratoryRate":\s*(\d+)/)[0][1])

                  def alertLevel = (jsonBody =~
                  /"alertLevel":\s*"([^"]+)"/)[0][1]

                  def isCritical = (jsonBody =~
                  /"isCritical":\s*(true|false)/)[0][1]


                  // Calculate analytics data

                  def heartRateTrend = heartRate > 100 ? "HIGH" : heartRate < 60
                  ? "LOW" : "NORMAL"

                  def oxygenTrend = oxygenSat < 95 ? "DECLINING" : "STABLE"

                  def temperatureTrend = temperature > 37.5 ? "ELEVATED" :
                  "NORMAL"


                  // Calculate risk score

                  def riskScore = 0

                  if (heartRate > 120 || heartRate < 50) riskScore += 30

                  if (oxygenSat < 90) riskScore += 40

                  if (temperature > 38.5) riskScore += 20

                  if (systolic > 140) riskScore += 15

                  riskScore = Math.min(riskScore, 100)


                  // Build JSON string manually and convert to String

                  def result = """{
                    "patientId": "${patientId}",
                    "timestamp": "${timestamp}",
                    "ward": "${ward}",
                    "deviceType": "${deviceType}",
                    "deviceId": "${deviceId}",
                    "vitalSigns": {
                      "heartRate": ${heartRate},
                      "bloodPressure": {
                        "systolic": ${systolic},
                        "diastolic": ${diastolic}
                      },
                      "oxygenSaturation": ${oxygenSat},
                      "temperature": ${temperature},
                      "respiratoryRate": ${respiratoryRate}
                    },
                    "alertLevel": "${alertLevel}",
                    "isCritical": ${isCritical},
                    "analyticsData": {
                      "trendAnalysis": {
                        "heartRateTrend": "${heartRateTrend}",
                        "oxygenTrend": "${oxygenTrend}",
                        "temperatureTrend": "${temperatureTrend}"
                      },
                      "riskScore": ${riskScore},
                      "mlModelVersion": "v2.1.3",
                      "predictionTimestamp": "${timestamp}"
                    }
                  }"""

                  return result.toString()
        - setHeader:
            id: extract-analytics-patient-id
            expression:
              jsonpath:
                expression: $.patientId
            name: patientId
        - log:
            id: log-analytics-processing
            message: "Wire Tap 3 - Analytics: Pattern analysis completed for patient
              ${header.patientId}"
        - to:
            id: analytics-file-output
            uri: file:analytics-data/patterns
            parameters:
              fileName: analytics-${date:now:yyyyMMdd-HHmmss-SSS}.json
