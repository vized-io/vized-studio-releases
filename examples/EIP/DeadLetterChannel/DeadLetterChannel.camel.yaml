- route:
    id: "get-dead-letter-status"
    from:
      id: "dlq-status"
      uri: "direct:getDeadLetterStatus"
      steps:
        - setHeader:
            id: "set-failed-count"
            name: "failedCount"
            expression:
              method:
                ref: "fileCounterService"
                method: "countJsonFiles('failed')"
        - setHeader:
            id: "set-alerts-count"
            name: "alertsCount"
            expression:
              method:
                ref: "fileCounterService"
                method: "countTxtFiles('alerts')"
        - setBody:
            id: "dlq-status-response"
            expression:
              simple: |
                {
                  "status": "success",
                  "message": "Dead letter queue status retrieved",
                  "failedMessages": "${header.failedCount}",
                  "criticalAlerts": "${header.alertsCount}",
                  "timestamp": "${date:now:yyyy-MM-dd HH:mm:ss}"
                }
        - setHeader:
            id: "content-type-json"
            name: "Content-Type"
            expression:
              simple: "application/json"

- route:
    id: "get-failure-stats"
    from:
      id: "failure-stats"
      uri: "direct:getFailureStats"
      steps:
        - setHeader:
            id: "set-processed-count"
            name: "successfulCount"
            expression:
              method:
                ref: "fileCounterService"
                method: "countJsonFiles('processed')"
        - setHeader:
            id: "set-failed-stats-count"
            name: "failedStatsCount"
            expression:
              method:
                ref: "fileCounterService"
                method: "countJsonFiles('failed')"
        - setHeader:
            id: "set-alerts-stats-count"
            name: "alertsStatsCount"
            expression:
              method:
                ref: "fileCounterService"
                method: "countTxtFiles('alerts')"
        - setHeader:
            id: "total-processed"
            name: "totalProcessed"
            expression:
              groovy: "Integer.parseInt(request.headers.successfulCount.toString()) + Integer.parseInt(request.headers.failedStatsCount.toString())"
        - setBody:
            id: "stats-response"
            expression:
              simple: |
                {
                  "status": "success",
                  "totalProcessed": "${header.totalProcessed}",
                  "successful": "${header.successfulCount}",
                  "failed": "${header.failedStatsCount}",
                  "retryAttempts": "6",
                  "criticalFailures": "${header.alertsStatsCount}",
                  "failureReasons": {
                    "dataCorruption": "2",
                    "rangeViolation": "1"
                  }
                }
        - setHeader:
            id: "content-type-json-stats"
            name: "Content-Type"
            expression:
              simple: "application/json"

